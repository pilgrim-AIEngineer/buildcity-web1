name: No temporary code in main

# Reminder guard: fails any PR into main (and any push to main) while code
# tagged with a temporary marker is still present. Remove the tagged code
# to make this check pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-temp-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if TEMP-VENDOR-WEB-LOGIN is still present
        run: |
          if grep -rn "TEMP-VENDOR-WEB-LOGIN" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github . ; then
            echo "::error::Temporary /vendor/login web route is still in the code (TEMP-VENDOR-WEB-LOGIN)."
            echo "::error::Remove the /vendor/login route in src/App.jsx and the forceVendorMode prop in src/pages/auth/Login.jsx before merging into main."
            exit 1
          fi
          echo "No temporary markers found."
